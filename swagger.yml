{
  "openapi": "3.0.0",
  "info": {
    "title": "Auth API",
    "version": "1.0.0",
    "description": "API documentation for the Production Auth application"
  },
  "servers": [
    {
      "url": "http://localhost:5000/api/v1",
      "description": "Local development server"
    },
    {
      "url": "https://authentication-d5jy.onrender.com/api/v1",
      "description": "Production server"
    }
  ],
  "tags": [
    {
      "name": "Authentication",
      "description": "User authentication operations"
    },
    {
      "name": "Settings",
      "description": "User settings operations"
    }
  ],
  "components": {
    "securitySchemes": {
      "BearerAuth": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "JWT",
        "description": "Enter JWT token - \"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...\""
      },
      "CookieAuth": {
        "type": "apiKey",
        "in": "cookie",
        "name": "refreshToken"
      }
    }
  },
  "paths": {
    "/auth/register": {
      "post": {
        "summary": "Register a new User",
        "tags": [
          "Authentication"
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "fullName": {
                    "type": "string",
                    "description": "User's full name",
                    "example": "John Doe"
                  },
                  "email": {
                    "type": "string",
                    "example": "user@example.com"
                  },
                  "password": {
                    "type": "string",
                    "example": "password123"
                  }
                },
                "required": [
                  "fullName",
                  "email",
                  "password"
                ]
              }
            }
          }
        },
        "responses": {
          "201": {
            "description": "User registered successfully",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "required": [
                    "success",
                    "message"
                  ],
                  "properties": {
                    "success": {
                      "type": "boolean"
                    },
                    "message": {
                      "type": "string"
                    },
                    "data": {
                      "type": "object",
                      "properties": {
                        "id": {
                          "type": "string"
                        },
                        "email": {
                          "type": "string"
                        },
                        "fullName": {
                          "type": "string"
                        },
                        "isVerified": {
                          "type": "boolean"
                        }
                      }
                    }
                  },
                  "example": {
                    "success": true,
                    "message": "User registered successfully",
                    "data": {
                      "id": "123e4567-e89b-12d3-a456-426614174000",
                      "email": "user@example.com",
                      "fullName": "John Doe",
                      "isVerified": false
                    }
                  }
                }
              }
            }
          },
          "400": {
            "$ref": "#/paths/~1auth~1me/get/responses/400"
          },
          "404": {
            "$ref": "#/paths/~1auth~1me/get/responses/404"
          },
          "429": {
            "$ref": "#/paths/~1auth~1me/get/responses/429"
          },
          "500": {
            "$ref": "#/paths/~1auth~1me/get/responses/500"
          }
        }
      }
    },
