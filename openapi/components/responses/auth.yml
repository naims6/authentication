RegisterSuccess:
  description: User registered successfully
  content:
    application/json:
      schema:
        type: object
        required:
          - success
          - message
        properties:
          success:
            type: boolean
          message:
            type: string
          data:
            type: object
            properties:
              id:
                type: string
              email:
                type: string
              fullName:
                type: string
              isVerified:
                type: boolean
        example:
          success: true
          message: User registered successfully
          data:
            id: "123e4567-e89b-12d3-a456-426614174000"
            email: "user@example.com"
            fullName: "John Doe"
            isVerified: false

LoginSuccess:
  description: User logged in successfully
  content:
    application/json:
      schema:
        type: object
        required:
          - success
          - message
          - data
        properties:
          success:
            type: boolean
          message:
            type: string
          data:
            type: object
            properties:
              accessToken:
                type: string
              refreshToken:
                type: string
        example:
          success: true
          message: User logged in successfully
          data:
            accessToken: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
            refreshToken: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."

