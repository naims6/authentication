# Get Session
GetAllSessionsSuccess:
  description: Get all sessions successful
  content:
    application/json:
      schema:
        type: object
        required:
          - success
          - message
          - data
        properties:
          success:
            type: boolean
          message:
            type: string
          data:
            type: array
            items:
              type: object
              properties:
                id:
                  type: string
                deviceInfo:
                  type: string
                sessionId:
                  type: string
        example:
          success: true
          message: Get all sessions successful
          data:
            - id: "1"
              deviceInfo: "Linux Os - Chrome - 127.0.0.1"
              sessionId: "abc123"

